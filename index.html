<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxC Lavalink Node | Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #090a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Glow Effects */
        .glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 92, 255, 0.3) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: 1;
        }

        .glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.25) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: 1;
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 2;
            position: relative;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Status Indicator */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #8A5CFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #8A5CFF;
            transition: color 0.3s ease;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            font-size: 0.8rem;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .footer span {
            color: #8A5CFF;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="card">
        <div class="status-badge">
            <span class="status-dot"></span>
            Server Running 24/7
        </div>

        <h1>AxC Lavalink Node</h1>
        <p>This high-performance Lavalink v4 audio node is active and operating normally.</p>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value">Lavalink v4</div>
                <div class="stat-label">Version</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">Active</div>
                <div class="stat-label">System State</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="ping-value">-- ms</div>
                <div class="stat-label">Real-time Ping</div>
            </div>
        </div>

        <div class="footer">
            Powered by <span>AxC Music Core</span>
        </div>
    </div>

    <script>
        async function checkPing() {
            const pingEl = document.getElementById('ping-value');
            const start = performance.now();
            try {
                const response = await fetch('/ping?t=' + Date.now(), { cache: 'no-store' });
                if (response.ok) {
                    const latency = Math.round(performance.now() - start);
                    pingEl.innerText = latency + ' ms';
                    if (latency < 80) {
                        pingEl.style.color = '#10b981'; // Green
                    } else if (latency < 200) {
                        pingEl.style.color = '#f59e0b'; // Yellow/Orange
                    } else {
                        pingEl.style.color = '#ef4444'; // Red
                    }
                } else {
                    pingEl.innerText = 'Error';
                    pingEl.style.color = '#ef4444';
                }
            } catch (err) {
                pingEl.innerText = 'Offline';
                pingEl.style.color = '#ef4444';
            }
        }

        checkPing();
        setInterval(checkPing, 2000);
    </script>
</body>
</html>
